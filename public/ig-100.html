<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100 tipov – obrázok na Instagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
  /* 17. 11. 2026 – Michal: príspevok „73 zo 100“, štvorčeky v poradí, ako išli zápasy */
  :root{--bg:#0F1530;--card:#18204A;--text:#F2F4FF;--muted:#A9B2D9;--acc:#FFD43B}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 "DM Sans",system-ui,sans-serif}
  main{max-width:760px;margin:0 auto;padding:24px 16px 60px}
  a{color:var(--acc)}
  h1{font:700 24px/1.2 "Unbounded",sans-serif;margin:8px 0 6px}
  p.note{color:var(--muted);margin:0 0 18px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
  button{font:700 15px/1 "DM Sans",sans-serif;padding:12px 16px;border-radius:999px;border:1px solid #3A4580;background:var(--card);color:var(--text);cursor:pointer}
  button.on{background:var(--acc);color:#0B1C9C;border-color:var(--acc)}
  button.main{background:#fff;color:#0B1C9C;border-color:#fff}
  #out{width:100%;border-radius:18px;display:block;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  textarea{width:100%;min-height:230px;margin-top:16px;padding:14px;border-radius:14px;border:1px solid #3A4580;background:var(--card);color:var(--text);font:400 15px/1.5 "DM Sans",sans-serif}
  #msg{color:var(--muted);margin:10px 0}
</style>
</head>
<body>
<main>
  <a href="/">← Späť do appky</a>
  <h1>100 tipov – obrázok na Instagram</h1>
  <p class="note">Každý štvorček je jeden tip v poradí, ako išli zápasy (zľava doprava, riadok po riadku). Biely = vyšiel, červený = nevyšiel. Rátajú sa len tipy zo štatistík (bez sledovaných a nevyhodnotených).</p>
  <div class="bar">
    <button data-k="first" class="on">Prvých 100</button>
    <button data-k="last">Posledných 100</button>
  </div>
  <div id="msg">Načítavam tipy…</div>
  <canvas id="out" width="1080" height="1350"></canvas>
  <div class="bar" style="margin-top:16px">
    <button class="main" id="dl">Stiahnuť obrázok PNG</button>
    <button id="cp">Kopírovať text</button>
  </div>
  <textarea id="txt" readonly></textarea>
</main>
<script>
(() => {
  const W = 1080, H = 1350, X = 76;
  const C = { white: "#F6EAD0", bad: "#E0607A", acc: "#E9C98A", deep: "#2A0E22", soft: "rgba(246,234,208,.85)", faint: "rgba(246,234,208,.6)", line: "rgba(233,201,138,.25)" };
  const st = { kind: "first", tips: [] };
  const cv = document.getElementById("out"), ctx = cv.getContext("2d");
  const LOGO = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="gf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6E7BE"/><stop offset=".5" stop-color="#D6B676"/><stop offset="1" stop-color="#9C7834"/></linearGradient></defs><circle cx="50" cy="50" r="48" fill="#0B0B0C"/><g fill="none" stroke="url(#gf)"><circle cx="50" cy="50" r="46" stroke-width="2.4"/><circle cx="50" cy="50" r="31" stroke-width="1.2" opacity=".7"/><circle cx="50" cy="50" r="16" stroke-width="1.2" opacity=".55"/><path d="M50 50 75 25" stroke-width="3" stroke-linecap="round"/></g><path d="M50 50 L50 19 A31 31 0 0 1 71.9 28.1 Z" fill="url(#gf)" opacity=".28"/><circle cx="50" cy="50" r="4" fill="url(#gf)"/><circle cx="66" cy="36" r="3" fill="#F6E7BE"/></svg>`;
  const logo = new Image();
  const logoReady = new Promise((r) => { logo.onload = r; logo.onerror = r; });
  logo.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(LOGO);

  const U = (w, s) => `${w} ${s}px Unbounded`;
  const D = (w, s) => `${w} ${s}px "DM Sans"`;
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  // text s farebnými časťami: [[text, farba, font], ...]
  function runs(parts, x, y) { for (const [t, c, f] of parts) { ctx.font = f; ctx.fillStyle = c; ctx.fillText(t, x, y); x += ctx.measureText(t).width; } return x; }

  function background() {
    // 17. 11. – farby ako reklama „Messi 91“: navy → bordová + zlatá
    let g = ctx.createLinearGradient(0, 0, W * 0.6, H);
    g.addColorStop(0, "#0B1638"); g.addColorStop(0.45, "#1A1240"); g.addColorStop(1, "#4A0F2B");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    g = ctx.createRadialGradient(W * 0.85, 0, 0, W * 0.85, 0, 760); g.addColorStop(0, "rgba(225,170,90,.28)"); g.addColorStop(1, "rgba(225,170,90,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(233,201,138,.04)"; ctx.lineWidth = 1;
    for (let x = 0.5; x < W; x += 54) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0.5; y < H; y += 54) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  }

  function pick() {
    const done = st.tips.filter((t) => t.status === "won" || t.status === "lost");
    return st.kind === "last" ? done.slice(-100) : done.slice(0, 100);
  }

  function draw() {
    const tips = pick(), n = tips.length, won = tips.filter((t) => t.status === "won").length;
    ctx.clearRect(0, 0, W, H);
    background();
    ctx.textBaseline = "alphabetic";

    // štítok
    const label = (st.kind === "last" ? "POSLEDNÝCH " : "PRVÝCH ") + n + " TIPOV";
    ctx.font = U(700, 22);
    const lw = ctx.measureText(label).width + 52;
    rr(X, 72, lw, 50, 25); ctx.fillStyle = C.acc; ctx.fill();
    ctx.fillStyle = C.deep; ctx.fillText(label, X + 26, 105);

    // kruh
    const cx = X + 260, cy = 166 + 260, R = 230;
    ctx.lineWidth = 38;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.strokeStyle = "rgba(224,96,122,.75)"; ctx.stroke();
    if (n) { ctx.beginPath(); ctx.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (won / n)); ctx.strokeStyle = C.white; ctx.stroke(); }
    ctx.textAlign = "center";
    { const gg = ctx.createLinearGradient(cx - 180, cy - 140, cx + 180, cy + 60); gg.addColorStop(0, "#FFE3A8"); gg.addColorStop(0.55, "#F0A35E"); gg.addColorStop(1, "#E0607A"); ctx.fillStyle = gg; } ctx.font = U(900, String(won).length > 2 ? 150 : 196); ctx.fillText(String(won), cx, cy + 50);
    ctx.fillStyle = C.soft; ctx.font = U(500, 40); ctx.fillText("zo " + n, cx, cy + 110);
    ctx.textAlign = "left";

    // vpravo
    const rx = 642;
    ctx.fillStyle = C.white; ctx.font = U(900, 84);
    ctx.fillText("tipov", rx, 340); ctx.fillText("vyšlo.", rx, 420);
    ctx.font = D(400, 34);
    runs([["Zverejnené ", C.soft, D(400, 34)], ["pred", C.acc, D(700, 34)]], rx, 486);
    runs([["zápasom. Aj tie, čo", C.soft, D(400, 34)]], rx, 532);
    runs([["nevyšli.", C.soft, D(400, 34)]], rx, 578);

    // štvorčeky v poradí zápasov
    const cols = 20, gap = 12, cell = (W - 2 * X - (cols - 1) * gap) / cols, gy = 752;
    tips.forEach((t, i) => {
      const x = X + (i % cols) * (cell + gap), y = gy + Math.floor(i / cols) * (cell + gap);
      if (t.status === "won") { rr(x, y, cell, cell, 7); ctx.fillStyle = C.white; ctx.fill(); }
      else { rr(x + 1.5, y + 1.5, cell - 3, cell - 3, 6); ctx.fillStyle = "rgba(224,96,122,.16)"; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = C.bad; ctx.stroke(); }
    });
    const rows = Math.max(1, Math.ceil(n / cols));
    const ly = gy + rows * (cell + gap) + 48;
    rr(X, ly - 20, 20, 20, 5); ctx.fillStyle = C.white; ctx.fill();
    ctx.font = D(700, 26); ctx.fillStyle = C.soft; ctx.fillText(won + " vyšlo", X + 32, ly - 1);
    const x2 = X + 32 + ctx.measureText(won + " vyšlo").width + 36;
    rr(x2 + 1.5, ly - 18.5, 17, 17, 4); ctx.lineWidth = 3; ctx.strokeStyle = C.bad; ctx.stroke();
    ctx.fillStyle = C.soft; ctx.fillText((n - won) + " nevyšlo", x2 + 32, ly - 1);
    ctx.font = D(500, 22); ctx.fillStyle = "rgba(246,234,208,.5)";
    ctx.fillText("Poradie podľa dátumu zápasu →", X, ly + 40);

    // otázka
    ctx.font = D(700, 40); ctx.fillStyle = C.acc; ctx.fillText("Koľko by ste trafili vy? 👇", X, 1166);

    // pätička
    ctx.fillStyle = C.line; ctx.fillRect(X, 1201, W - 2 * X, 1);
    ctx.drawImage(logo, X, 1222, 54, 54);
    ctx.fillStyle = C.white; ctx.font = U(700, 28); ctx.fillText("TipRadar", X + 70, 1258);
    ctx.fillStyle = C.acc; ctx.font = D(700, 14);
    ctx.letterSpacing = "4px"; ctx.fillText("FUTBALOVÁ ANALYTIKA", X + 70, 1283); ctx.letterSpacing = "0px";
    ctx.textAlign = "right"; ctx.font = D(400, 23); ctx.fillStyle = C.faint; ctx.fillText("tipradar.eu · 18+", W - X, 1266); ctx.textAlign = "left";

    // text
    const prvych = st.kind === "last" ? "Posledných" : "Prvých";
    document.getElementById("txt").value =
`${won} zo ${n}. ✅❌

${prvych} ${n} tipov TipRadaru: ${won} vyšlo, ${n - won} nie. Každý štvorček na obrázku je jeden tip – presne v poradí, ako išli zápasy.

Každý tip sme zverejnili pred zápasom – nič sme dodatočne nemazali ani neprikrášľovali. Za každým je model, ktorý pred zápasom prejde góly, rohy, karty, strely a fauly oboch tímov.

Nie je to o jednom šťastnom víkende, ale o tom, čo vydrží ${n} zápasov.

Koľko z nich by ste trafili vy? 👇

#tipradar #futbal #futbalovestatistiky #analyzazapasu #futbalvcislach`;
    const first = tips[0], last = tips[n - 1];
    const fmt = (d) => d ? d.split("-").reverse().map((x, i) => i < 2 ? String(+x) : x).join(". ") : "";
    document.getElementById("msg").textContent = n ? `${n} tipov od ${fmt(first.day)} do ${fmt(last.day)}: ${won} vyšlo, ${n - won} nevyšlo.` : "Zatiaľ žiadne vyhodnotené tipy.";
  }

  document.querySelectorAll("[data-k]").forEach((b) => b.addEventListener("click", () => {
    st.kind = b.dataset.k;
    document.querySelectorAll("[data-k]").forEach((x) => x.classList.toggle("on", x === b));
    draw();
  }));
  document.getElementById("dl").addEventListener("click", () => {
    cv.toBlob((blob) => { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `tipradar-${st.kind === "last" ? "poslednych" : "prvych"}-100.png`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }, "image/png");
  });
  document.getElementById("cp").addEventListener("click", async (e) => {
    try { await navigator.clipboard.writeText(document.getElementById("txt").value); e.target.textContent = "Skopírované ✓"; setTimeout(() => (e.target.textContent = "Kopírovať text"), 1500); } catch {}
  });

  const today = new Date(Date.now() + 3600e3).toISOString().slice(0, 10);
  Promise.all([
    fetch(`/api/ig/range?from=2026-01-01&to=${today}`).then((r) => r.json()),
    ...["900 196px Unbounded", "700 84px Unbounded", "500 40px Unbounded", "400 34px \"DM Sans\"", "700 34px \"DM Sans\""].map((f) => document.fonts.load(f, "vyšlo PRVÝCH POSLEDNÝCH Koľko ľščťžýáíéúäô").catch(() => {})),
    logoReady,
  ]).then(([data]) => document.fonts.ready.then(() => {
    if (!data || !Array.isArray(data.tips)) throw new Error(data && data.error || "Chyba");
    st.tips = data.tips;
    draw();
  })).catch((e) => { document.getElementById("msg").textContent = "Nepodarilo sa načítať tipy: " + e.message; });
})();
</script>
</body>
</html>
