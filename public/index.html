<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Futbal Tipy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <h1>Futbal Tipy</h1>
      </div>
      <button class="btn-ghost" id="toggleFiltersBtn">Filtre</button>
    </header>

    <aside class="sidebar" id="sidebar">
      <nav class="league-list" id="leagueList"></nav>

      <div class="field-group">
        <label for="customLeagueId">Vlastný kód súťaže</label>
        <input type="text" id="customLeagueId" placeholder="napr. PL, DED, PPL" />
      </div>

      <div class="field-group">
        <label for="seasonInput">Sezóna</label>
        <input type="number" id="seasonInput" value="2026" />
      </div>

      <button class="btn-primary" id="loadFixturesBtn">Načítať zápasy</button>
    </aside>

    <main class="content">
      <section class="fixture-column">
        <div class="column-header">
          <h2>Zápasy tento týždeň</h2>
          <span class="muted" id="fixtureCount"></span>
        </div>
        <div class="fixture-list" id="fixtureList">
          <p class="empty-state">Vyber ligu a klikni na „Načítať zápasy“.</p>
        </div>
      </section>

      <section class="analysis-column" id="analysisColumn">
        <div class="empty-state analysis-empty">
          <p>Vyber zápas zo zoznamu.</p>
          <p class="muted small">Zobrazí sa štatistická analýza a odporúčaný tip.</p>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
